name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version name, e.g. 5.5.7 (default: app/build.gradle)"
        required: false
        type: string
      version_code:
        description: "Version code (default: app/build.gradle)"
        required: false
        type: string
      draft:
        description: "Create the release as draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned media3 fork commit that provides the player AARs (lib-mpvplayer, lib-decoder-ffmpeg, ...).
  MEDIA3_FORK_REPO: https://github.com/FongMi/media.git
  MEDIA3_FORK_BRANCH: release-1.11.0-fongmi
  MEDIA3_FORK_COMMIT: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
  MEDIA3_MODULES: >-
    lib-common lib-container lib-database lib-datasource lib-datasource-okhttp
    lib-datasource-rtmp lib-decoder lib-decoder-ffmpeg lib-decoder-mpegh lib-effect
    lib-exoplayer lib-exoplayer-dash lib-exoplayer-hls lib-exoplayer-rtsp
    lib-exoplayer-smoothstreaming lib-extractor lib-mpvplayer lib-session lib-ui lib-ui-danmaku

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            echo "::error::No Android SDK found on the runner."
            exit 1
          fi
          echo "SDK root: ${SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMGR=$(ls "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found in ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          compile_sdk=$(grep -oP '^compileSdk\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          build_tools=$(grep -oP '^buildTools\s*=\s*"\K[^"]+' gradle/libs.versions.toml 2>/dev/null || true)
          if [ -z "${build_tools}" ]; then build_tools="${compile_sdk}.0.0"; fi
          echo "compileSdk=${compile_sdk} buildTools=${build_tools}"
          yes | "${SDKMGR}" --licenses > /dev/null || true
          "${SDKMGR}" --install "platform-tools" "build-tools;${build_tools}" "platforms;android-${compile_sdk}" \
            || "${SDKMGR}" --install "platform-tools" "build-tools;${build_tools}" "platforms;android-${compile_sdk}.0"
          # Newer SDK channels publish minor platform versions (android-37.0); link them for AGP.
          if [ ! -d "${SDK_ROOT}/platforms/android-${compile_sdk}" ] && [ -d "${SDK_ROOT}/platforms/android-${compile_sdk}.0" ]; then
            ln -sfn "${SDK_ROOT}/platforms/android-${compile_sdk}.0" "${SDK_ROOT}/platforms/android-${compile_sdk}"
          fi
          ls -1 "${SDK_ROOT}/platforms"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          name="${{ inputs.version }}"
          code="${{ inputs.version_code }}"
          if [ -z "${name}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "${name}" ]; then
            name=$(sed -n -e 's/.*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' -e 's/.*versionName.*getOrElse("\([^"]*\)").*/\1/p' app/build.gradle | head -n 1)
          fi
          if [ -z "${code}" ]; then
            code=$(sed -n -e 's/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p' -e 's/.*versionCode.*getOrElse(\([0-9][0-9]*\)).*/\1/p' app/build.gradle | head -n 1)
          fi
          if [ -z "${code}" ]; then
            code=$(date +%Y%m%d%H)
          fi
          echo "version=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${name} (${code})"

      - name: Restore media3 AAR cache
        id: media3-cache
        uses: actions/cache@v4
        with:
          path: media3-aars
          key: media3-aars-${{ env.MEDIA3_FORK_COMMIT }}

      - name: Build media3 AARs
        if: steps.media3-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${MEDIA3_FORK_BRANCH}" "${MEDIA3_FORK_REPO}" media3-src
          cd media3-src
          if [ "$(git rev-parse HEAD)" != "${MEDIA3_FORK_COMMIT}" ]; then
            git fetch --depth 1 origin "${MEDIA3_FORK_COMMIT}"
            git checkout -q FETCH_HEAD
          fi
          git log -1 --format='media3 fork: %H %s'
          chmod +x gradlew
          tasks=""
          for module in ${MEDIA3_MODULES}; do tasks="${tasks} :${module}:assembleRelease"; done
          ./gradlew --no-daemon --stacktrace ${tasks}
          cd ..
          mkdir -p media3-aars
          find media3-src/libraries \( -path "*/buildout/outputs/aar/*.aar" -o -path "*/build/outputs/aar/*.aar" \) -exec cp -v {} media3-aars/ \;
          ls -l media3-aars

      - name: Install media3 AARs
        run: |
          set -euo pipefail
          test -d media3-aars
          mkdir -p app/libs
          cp -v media3-aars/*.aar app/libs/
          ls -l app/libs

      - name: Prepare signing config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/keys"
          if [ -n "${KEYSTORE}" ]; then
            printf '%s' "${KEYSTORE}" | base64 -d > "${HOME}/keys/release.jks"
            alias="${KEY_ALIAS:-release}"
            keypass="${KEY_PASSWORD:-${STORE_PASSWORD}}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with a temporary key."
            keytool -genkeypair -keystore "${HOME}/keys/release.jks" -alias release \
              -storepass release123 -keypass release123 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TV, OU=TV, O=TV, L=TV, S=TV, C=TW" > /dev/null 2>&1
            STORE_PASSWORD=release123
            alias=release
            keypass=release123
          fi
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "storeFile=${HOME}/keys/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${alias}"
            echo "keyPassword=${keypass}"
          } > local.properties

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PtvVersionName="${{ steps.version.outputs.version }}" \
            -PtvVersionCode="${{ steps.version.outputs.code }}" \
            assembleRelease

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p Release/apk
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} Release/apk/ \;
          ls -l Release/apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.version }}
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: Release/apk/*.apk
