name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version name, e.g. 5.9.0 (default: app/build.gradle)"
        required: false
        type: string
      version_code:
        description: "Version code (default: app/build.gradle)"
        required: false
        type: string
      draft:
        description: "Create the release as draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -euo pipefail
          compile_sdk=$(grep -oP '^compileSdk\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          build_tools=$(grep -oP '^buildTools\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          echo "compileSdk=${compile_sdk} buildTools=${build_tools}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-${compile_sdk}" "build-tools;${build_tools}" "platform-tools" > /dev/null

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          name="${{ inputs.version }}"
          code="${{ inputs.version_code }}"
          if [ -z "${name}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "${name}" ]; then
            name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          fi
          if [ -z "${code}" ]; then
            code=$(grep -oP 'getOrElse\(\K[0-9]+(?=\)\s*$)' app/build.gradle | head -n 1)
          fi
          if [ -z "${code}" ]; then
            code=$(date +%Y%m%d%H)
          fi
          echo "version=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${name} (${code})"

      - name: Restore player artifacts
        env:
          MPV_AAR: ${{ secrets.PLAYER_AAR_MPV_BASE64 }}
          FFMPEG_AAR: ${{ secrets.PLAYER_AAR_FFMPEG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MPV_AAR}" ] || [ -z "${FFMPEG_AAR}" ]; then
            echo "::error::Missing PLAYER_AAR_MPV_BASE64 / PLAYER_AAR_FFMPEG_BASE64 repository secrets."
            exit 1
          fi
          mkdir -p app/libs
          printf '%s' "${MPV_AAR}" | base64 -d > app/libs/lib-mpvplayer-release.aar
          printf '%s' "${FFMPEG_AAR}" | base64 -d > app/libs/lib-decoder-ffmpeg-release.aar
          ls -l app/libs

      - name: Prepare signing config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/keys"
          if [ -n "${KEYSTORE}" ]; then
            printf '%s' "${KEYSTORE}" | base64 -d > "${HOME}/keys/release.jks"
            alias="${KEY_ALIAS:-release}"
            keypass="${KEY_PASSWORD:-${STORE_PASSWORD}}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with a temporary key."
            keytool -genkeypair -keystore "${HOME}/keys/release.jks" -alias release \
              -storepass release123 -keypass release123 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TV, OU=TV, O=TV, L=TV, S=TV, C=TW" > /dev/null 2>&1
            STORE_PASSWORD=release123
            alias=release
            keypass=release123
          fi
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "storeFile=${HOME}/keys/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${alias}"
            echo "keyPassword=${keypass}"
          } > local.properties

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PtvVersionName="${{ steps.version.outputs.version }}" \
            -PtvVersionCode="${{ steps.version.outputs.code }}" \
            exportLeanbackReleaseApks exportMobileReleaseApks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.version }}
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: Release/apk/*.apk
